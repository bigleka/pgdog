# Builds the .deb, .rpm and .apk packages for amd64 and arm64, tests each on
# the distributions it targets and, for a v* tag, attaches them to the
# GitHub Release. See packaging/README.md.
name: release
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/release.yml'
      - 'pgdog/Cargo.toml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NFPM_VERSION: 2.43.0

jobs:
  binary:
    name: binary (${{ matrix.libc }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        libc: [glibc, musl]
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/build-cache/registry
            ~/build-cache/git
            ~/build-cache/target
          key: release-${{ matrix.libc }}-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'packaging/builder/*') }}
          restore-keys: release-${{ matrix.libc }}-${{ matrix.arch }}-

      - name: Build builder image
        run: docker build -t pgdog-builder -f packaging/builder/${{ matrix.libc }}.Containerfile packaging/builder

      - name: Compile
        run: |
          mkdir -p ~/build-cache/registry ~/build-cache/git ~/build-cache/target
          docker run --rm \
            -v "$PWD":/src -w /src \
            -v ~/build-cache/registry:/usr/local/cargo/registry \
            -v ~/build-cache/git:/usr/local/cargo/git \
            -v ~/build-cache/target:/target -e CARGO_TARGET_DIR=/target \
            pgdog-builder sh -c 'git config --global --add safe.directory /src && packaging/scripts/compile.sh dist'
          # Files written by root in the container; the cache step needs them.
          sudo chown -R "$(id -u):$(id -g)" ~/build-cache dist

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.libc }}-${{ matrix.arch }}
          path: dist/pgdog
          if-no-files-found: error
          retention-days: 3

  package:
    name: package (${{ matrix.arch }})
    needs: binary
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*-${{ matrix.arch }}
          path: dist

      - name: Install nfpm
        run: |
          arch=$([ "${{ matrix.arch }}" = amd64 ] && echo x86_64 || echo arm64)
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          tarball="nfpm_${NFPM_VERSION}_Linux_${arch}.tar.gz"
          curl --retry 5 --retry-all-errors -fsSLO "$base/$tarball"
          curl --retry 5 --retry-all-errors -fsSL "$base/checksums.txt" | grep " $tarball\$" | sha256sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin nfpm

      - name: Package
        run: |
          chmod +x dist/*/pgdog
          packaging/package.sh ${{ matrix.arch }} \
            dist/binary-glibc-${{ matrix.arch }}/pgdog \
            dist/binary-musl-${{ matrix.arch }}/pgdog \
            packages

      - name: Install test
        run: ENGINE=docker packaging/test/run.sh packages ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: packages/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches pgdog/Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pgdog/Cargo.toml | head -n1)
          [ "$GITHUB_REF_NAME" = "v$version" ] || {
            echo "tag $GITHUB_REF_NAME, but pgdog/Cargo.toml is $version" >&2
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packages
          sha256sum * > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --clobber
          else
            gh release create "$GITHUB_REF_NAME" * --verify-tag --generate-notes --title "PgDog $GITHUB_REF_NAME"
          fi
