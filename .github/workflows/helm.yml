# Helm chart (charts/pgdog): render tests, PgDog configcheck and an
# end-to-end install on kind for every change to it; published as an OCI
# chart on release tags.
name: helm
on:
  pull_request:
    paths: ['charts/**', '.github/workflows/helm.yml']
  push:
    branches: ['main']
    paths: ['charts/**', '.github/workflows/helm.yml']
    tags: ['v*']
  workflow_dispatch:

env:
  HELM_VERSION: v3.19.0
  KUBECONFORM_VERSION: v0.7.0
  YQ_VERSION: v4.45.4

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform and yq
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C "$HOME/bin" kubeconform
          curl -fsSL -o "$HOME/bin/yq" "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x "$HOME/bin/yq"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Render tests
        run: charts/pgdog/test/test.sh

      - name: PgDog accepts every rendered configuration
        env:
          ENGINE: docker
        run: charts/pgdog/test/configcheck.sh ghcr.io/bigleka/pgdog:main

  e2e:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: helm/kind-action@v1
        with:
          cluster_name: pgdog-e2e

      - name: Install on kind and test the result cache
        run: charts/pgdog/test/e2e/run.sh main

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [test, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package and push to ghcr.io/bigleka/charts
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/pgdog --version "$version" --app-version "$version" -d dist
          helm push "dist/pgdog-$version.tgz" oci://ghcr.io/bigleka/charts
