# Package description for nfpm (https://nfpm.goreleaser.com), shared by the
# .deb, .rpm and .apk. Built by packaging/package.sh, which sets:
#   VERSION  package version, from pgdog/Cargo.toml
#   ARCH     amd64 or arm64
# and copies the binary to .build/pgdog: glibc for deb/rpm, musl for apk.
# Packages are signed when these are set (see packaging/repo/README.md):
#   NFPM_RPM_KEY_FILE  armored GPG private key, for the .rpm
#   NFPM_APK_KEY_FILE  RSA private key (PEM), for the .apk
# Unset, they expand to nothing and nfpm leaves the packages unsigned.
name: pgdog
version: ${VERSION}
release: 1
arch: ${ARCH}
platform: linux
section: database
priority: optional
maintainer: bigleka <ricardo@leka.com.br>
vendor: bigleka
homepage: https://github.com/bigleka/pgdog
license: AGPL-3.0-only
description: |-
  PostgreSQL connection pooler, load balancer and sharder.
  PgDog speaks the PostgreSQL protocol: applications connect to it like to
  Postgres. It pools connections, splits reads across replicas, shards and
  caches query results in Redis.

overrides:
  deb:
    depends:
      - libc6 (>= 2.34)
      - libssl3 | libssl3t64
      - libgcc-s1
      - adduser | passwd
      - procps
  rpm:
    depends:
      - glibc >= 2.34
      - openssl-libs >= 1:3.0
      - libgcc
      - shadow-utils
      - util-linux
  apk:
    depends:
      - libgcc
      - libssl3
      - libcrypto3

contents:
  - src: .build/pgdog
    dst: /usr/bin/pgdog
    file_info:
      mode: 0755

  - dst: /etc/pgdog
    type: dir
    file_info:
      mode: 0750
    packager: deb
  - dst: /etc/pgdog
    type: dir
    file_info:
      mode: 0750
    packager: rpm
  # apk resets directory owners after postinstall; preinstall has created
  # the group by the time files are unpacked.
  - dst: /etc/pgdog
    type: dir
    file_info:
      mode: 0750
      group: pgdog
    packager: apk
  - src: config/pgdog.toml
    dst: /etc/pgdog/pgdog.toml
    type: config|noreplace
    file_info:
      mode: 0644
  - src: config/users.toml
    dst: /etc/pgdog/users.toml
    type: config|noreplace
    file_info:
      mode: 0640

  # systemd (deb, rpm)
  - src: systemd/pgdog.service
    dst: /usr/lib/systemd/system/pgdog.service
    packager: deb
  - src: systemd/pgdog@.service
    dst: /usr/lib/systemd/system/pgdog@.service
    packager: deb
  - src: systemd/pgdog.service
    dst: /usr/lib/systemd/system/pgdog.service
    packager: rpm
  - src: systemd/pgdog@.service
    dst: /usr/lib/systemd/system/pgdog@.service
    packager: rpm

  # OpenRC (apk)
  - src: openrc/pgdog.initd
    dst: /etc/init.d/pgdog
    packager: apk
    file_info:
      mode: 0755
  - src: openrc/pgdog.confd
    dst: /etc/conf.d/pgdog
    type: config|noreplace
    packager: apk
  - src: openrc/pgdog.logrotate
    dst: /etc/logrotate.d/pgdog
    type: config|noreplace
    packager: apk

  - src: ../README.md
    dst: /usr/share/doc/pgdog/README.md
  - src: ../docs/RESULT_CACHE.md
    dst: /usr/share/doc/pgdog/RESULT_CACHE.md
  - src: ../example.pgdog.toml
    dst: /usr/share/doc/pgdog/examples/pgdog.toml
  - src: ../example.users.toml
    dst: /usr/share/doc/pgdog/examples/users.toml
  - src: ../examples/grafana/dashboard.json
    dst: /usr/share/doc/pgdog/examples/grafana-dashboard.json
  - src: ../examples/grafana/prometheus/alerts.yml
    dst: /usr/share/doc/pgdog/examples/prometheus-alerts.yml
  - src: ../LICENSE
    dst: /usr/share/licenses/pgdog/LICENSE
    packager: rpm
  - src: ../LICENSE
    dst: /usr/share/doc/pgdog/copyright
    packager: deb
  - src: ../LICENSE
    dst: /usr/share/licenses/pgdog/LICENSE
    packager: apk

scripts:
  preinstall: scripts/preinstall.sh
  postinstall: scripts/postinstall.sh
  preremove: scripts/preremove.sh
  postremove: scripts/postremove.sh

deb:
  fields:
    Bugs: https://github.com/bigleka/pgdog/issues
rpm:
  group: Applications/Databases
  summary: PostgreSQL connection pooler, load balancer and sharder
  signature:
    key_file: ${NFPM_RPM_KEY_FILE}
apk:
  signature:
    key_file: ${NFPM_APK_KEY_FILE}
    # Users install the public key as /etc/apk/keys/pgdog-bigleka.rsa.pub.
    key_name: pgdog-bigleka
